name: Release - Build and Push Docker Images

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write  # nécessaire pour publier sur ghcr.io

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract and normalize variables
      id: vars
      run: |
        VERSION=${GITHUB_REF##*/}
        REPO_LC=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
        echo "REPO_LC=$REPO_LC" >> $GITHUB_ENV
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Build and push web-server image
      run: |
        IMAGE_NAME=ghcr.io/${{ env.REPO_LC }}/web-server:${{ env.VERSION }}
        docker build -t $IMAGE_NAME ./web-server
        docker push $IMAGE_NAME

    - name: Build and push ai-api image
      run: |
        IMAGE_NAME=ghcr.io/${{ env.REPO_LC }}/ia-api:${{ env.VERSION }}
        docker build -t $IMAGE_NAME ./ia-api
        docker push $IMAGE_NAME
