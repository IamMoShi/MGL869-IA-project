services:
  ia-api:
    build:
      context: ./ia-api
      dockerfile: Dockerfile
    container_name: ia-api
    ports:
      - "8000:8000"
    volumes:
      - ./ia-api:/ia-api
    environment:
      - PYTHONUNBUFFERED=1

  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: web-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - ./web-server/.env
    volumes:
      - ./web-server/databases:/web-server/databases
