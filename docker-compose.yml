services:
  ia-api:
    build:
      context: ./ia-api
      dockerfile: Dockerfile
    container_name: ia-api
    ports:
      - "8000:8000"
    volumes:
      - ./ia-api:/ia-api
    environment:
      - PYTHONUNBUFFERED=1

  web-server:
    build:
      context: ./web-server
      dockerfile: Dockerfile
    container_name: web-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - ./web-server/.env
    volumes:
      - ./web-server/databases:/web-server/databases

 # Collector
  collector-gateway:
    image: otel/opentelemetry-collector:0.110.0     # Always specify the desired version to avoid breaking changes!!
    container_name: otel-collector-gateway
    volumes:
      - ./observability/collector-gateway.yaml:/etc/collector-gateway.yaml
    command: [ "--config=/etc/collector-gateway.yaml" ]
    ports:
      - "1888:1888"         # pprof extension
      - "8888:8888"         # Prometheus metrics: exposed by the Collector to monitor the health of the collector itself
      - "8889:8889"         # Prometheus EXPORTER metrics: endpoint where services metrics are sent then scraped by the prometheus service to monitor instrumented services.
      - "13133:13133"       # health_check extension
      - "4317:4317"         # OTLP gRPC receiver
      - "4318:4318"         # OTLP HTTP receiver
      - "55679:55679"       # zpages extension

  # Loki to collect logs
  loki:
    image: grafana/loki:main-f80d68a   # Always specify the desired version to avoid breaking changes!!
    container_name: loki
    ports:
      - "3100:3100"        # HTTP port to receive logs data from the OTEL Collector
    restart: on-failure
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml
    command: [ "--config.file=/etc/loki/loki-config.yaml" ]

  prometheus:
    build:
      context: ./observability/prometheus
      dockerfile: Dockerfile
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'  
      - '--query.lookback-delta=5s'
      - '--web.enable-remote-write-receiver'  # Enable remote write receiver
    ports:
      - "9090:9090"
    restart: on-failure
    depends_on:
      - collector-gateway 

  grafana:
    image: grafana/grafana-enterprise # :10.3.10
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - ./observability/grafana-storage:/var/lib/grafana     
